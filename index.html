<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>重生之我和机娘杀疯了</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #07090c;
        --amber: #f2b01e;
        --bone: #ede6d6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        color: var(--bone);
        overflow: hidden;
        font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 700px at 62% 42%, rgba(242, 176, 30, 0.14), transparent 62%),
          radial-gradient(900px 600px at 30% 70%, rgba(90, 140, 160, 0.12), transparent 60%),
          linear-gradient(160deg, #0a0e14 0%, #07090c 55%, #050608 100%);
        transition: opacity 0.45s ease;
      }
      #boot::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);
        mix-blend-mode: overlay;
      }
      .boot-inner { position: relative; text-align: center; padding: 24px; }
      .boot-kicker {
        font: 600 11px/1.4 "Bahnschrift", "Arial Narrow", sans-serif;
        letter-spacing: 0.42em;
        color: rgba(237, 230, 214, 0.55);
        margin-bottom: 18px;
      }
      .boot-inner h1 {
        margin: 0;
        font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
        font-weight: 800;
        font-size: clamp(30px, 5.4vw, 64px);
        letter-spacing: 0.04em;
        line-height: 1.16;
        color: #f4efe4;
        text-shadow: 0 0 34px rgba(242, 176, 30, 0.22);
      }
      .boot-inner h1 span {
        display: block;
        background: linear-gradient(100deg, #f7d27a 0%, #f2b01e 45%, #b97612 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .boot-bar {
        width: min(360px, 62vw);
        height: 2px;
        margin: 30px auto 12px;
        background: rgba(237, 230, 214, 0.12);
        overflow: hidden;
      }
      .boot-bar i {
        display: block;
        width: 36%;
        height: 100%;
        background: var(--amber);
        animation: boot-slide 1.25s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(320%); }
      }
      .boot-status {
        font: 500 12px/1.5 "Bahnschrift", "Microsoft YaHei UI", sans-serif;
        letter-spacing: 0.2em;
        color: rgba(237, 230, 214, 0.62);
      }
      .boot-tip {
        position: fixed;
        left: 0; right: 0; bottom: 30px;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: rgba(237, 230, 214, 0.38);
      }
      #app { position: fixed; inset: 0; }
      #gl { display: block; width: 100%; height: 100%; outline: none; }
      #ui { position: absolute; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      body.no-webgl #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-kicker">REBIRTH // SKY RAMPAGE</div>
        <h1>重生之<span>我和机娘杀疯了</span></h1>
        <div class="boot-bar"><i></i></div>
        <div class="boot-status" id="boot-status">灵契同步中…</div>
      </div>
      <div class="boot-tip">提示：WASD / 方向键移动，左键主炮，右键追踪导弹 · 建议使用 Chrome / Edge</div>
    </div>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
